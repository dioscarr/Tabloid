services:
  tabloid-db:
    image: docker.io/library/postgres:17-alpine
    container_name: tabloid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TABLOID_DB_NAME:-tabloid}
      POSTGRES_USER: ${TABLOID_DB_USER:-tabloid}
      POSTGRES_PASSWORD: ${TABLOID_DB_PASSWORD:?Set TABLOID_DB_PASSWORD in the host-only deployment environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - tabloid-postgres:/var/lib/postgresql/data
    networks:
      tabloid-private:
        aliases:
          - postgres

  tabloid:
    image: ghcr.io/dioscarr/tabloid:${TABLOID_IMAGE_TAG:-main}
    pull_policy: always
    container_name: tabloid
    restart: unless-stopped
    ports:
      - "${TABLOID_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      tabloid-edge:
        aliases:
          - tabloid-app
      tabloid-private:
        aliases:
          - tabloid-web

  tabloid-tailscale:
    image: ghcr.io/dioscarr/tabloid-tailscale:${TABLOID_IMAGE_TAG:-main}
    pull_policy: always
    container_name: tabloid-tailscale
    hostname: tabloid
    restart: unless-stopped
    depends_on:
      tabloid:
        condition: service_healthy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in Portainer}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tabloid-tailscale-state:/var/lib/tailscale
    networks:
      - tabloid-edge

volumes:
  tabloid-tailscale-state:
  tabloid-postgres:

networks:
  tabloid-edge:
  tabloid-private:
    internal: true
