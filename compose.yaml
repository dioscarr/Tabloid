name: my-web-stack

services:
  tabloid:
    image: ghcr.io/dioscarr/tabloid:${TABLOID_IMAGE_TAG:-main}
    pull_policy: always
    container_name: tabloid
    restart: unless-stopped
    ports:
      - "${TABLOID_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      tabloid-edge:
        aliases:
          - tabloid-app
      tabloid-data-platform:
        aliases:
          - tabloid-web

  tabloid-tailscale:
    image: ghcr.io/dioscarr/tabloid-tailscale:${TABLOID_IMAGE_TAG:-main}
    pull_policy: always
    container_name: tabloid-tailscale
    hostname: tabloid
    restart: unless-stopped
    depends_on:
      tabloid:
        condition: service_healthy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in Portainer}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tabloid-tailscale-state:/var/lib/tailscale
    networks:
      - tabloid-edge

volumes:
  tabloid-tailscale-state:
    external: true
    name: my-web-stack_tabloid-tailscale-state

networks:
  tabloid-edge:
    external: true
    name: my-web-stack_default
  tabloid-data-platform:
    external: true
    name: tabloid-data-platform
