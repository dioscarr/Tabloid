name: Publish branch preview image

on:
  push:
    branches-ignore:
      - main
  create:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/dioscarr/tabloid

jobs:
  publish:
    name: Build and publish preview
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref != 'main')
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event_name == 'create' && github.event.ref || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.PREVIEW_BRANCH }}

      - name: Verify shared navigation contract
        shell: bash
        run: |
          if [[ -f scripts/verify-shared-nav.mjs ]]; then
            node scripts/verify-shared-nav.mjs
          else
            echo "Shared navigation verifier is not present on this legacy branch; continuing bootstrap."
          fi

      - name: Verify Brain application contract
        shell: bash
        run: |
          if [[ -f scripts/verify-brain-contract.mjs ]]; then
            node scripts/verify-brain-contract.mjs
          else
            echo "Brain contract verifier is not present on this legacy branch; continuing bootstrap."
          fi

      - name: Generate preview identifier
        id: preview
        shell: bash
        env:
          RAW_BRANCH: ${{ env.PREVIEW_BRANCH }}
        run: |
          raw="$RAW_BRANCH"
          slug=$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-38)
          test -n "$slug" || slug=branch
          hash=$(printf '%s' "$raw" | sha256sum | cut -c1-6)
          echo "id=${slug}-${hash}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=preview-${{ steps.preview.outputs.id }}
            type=sha,prefix=sha-

      - name: Build and publish preview image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
