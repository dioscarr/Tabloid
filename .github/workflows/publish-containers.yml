name: Publish deployment images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-containers.yml'
      - 'Containerfile'
      - 'Tailscale.Containerfile'
      - 'index.html'
      - 'nginx.conf'
      - 'package-lock.json'
      - 'package.json'
      - 'public/**'
      - 'src/**'
      - 'tailscale/**'
      - 'vite.config.js'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/dioscarr/tabloid
  TAILSCALE_IMAGE: ghcr.io/dioscarr/tabloid-tailscale

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate application image metadata
        id: app-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and publish application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}

      - name: Generate Tailscale gateway metadata
        id: tailscale-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.TAILSCALE_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and publish Tailscale gateway image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Tailscale.Containerfile
          push: true
          tags: ${{ steps.tailscale-meta.outputs.tags }}
          labels: ${{ steps.tailscale-meta.outputs.labels }}
