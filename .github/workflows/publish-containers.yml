name: Publish deployment images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-containers.yml'
      - 'Containerfile'
      - 'Tailscale.Containerfile'
      - 'index.html'
      - 'nginx.conf'
      - 'package-lock.json'
      - 'package.json'
      - 'public/**'
      - 'src/**'
      - 'tailscale/**'
      - 'vite.config.js'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/dioscarr/tabloid
  TAILSCALE_IMAGE: ghcr.io/dioscarr/tabloid-tailscale

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate application image metadata
        id: app-meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and publish application image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          cache-from: type=gha,scope=tabloid-app
          cache-to: type=gha,mode=max,scope=tabloid-app

      - name: Generate Tailscale gateway metadata
        id: tailscale-meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.TAILSCALE_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and publish Tailscale gateway image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Tailscale.Containerfile
          push: true
          tags: ${{ steps.tailscale-meta.outputs.tags }}
          labels: ${{ steps.tailscale-meta.outputs.labels }}
          cache-from: type=gha,scope=tabloid-tailscale
          cache-to: type=gha,mode=max,scope=tabloid-tailscale
