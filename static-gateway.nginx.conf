server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /deployments;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(?<deployment>[a-z0-9-]+)/current(?:/(?<asset>.*))?$ {
        try_files /$deployment/current/$asset /$deployment/current/$asset/ /$deployment/current/index.html =404;
    }

    location / {
        return 404;
    }
}
